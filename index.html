<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言管理系统</title>
    <meta name="description" content="现代化的留言消息管理系统，支持搜索、排序和分页功能">
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #1e3a8a;
            --secondary-gray: #6b7280;
            --accent-orange: #f97316;
            --bg-light: #f9fafb;
            --text-dark: #1f2937;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
        
        .hero-title {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stats-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .stats-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .message-table {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .table-header {
            background:  #2563eb;
            color: white;
        }
        
        .table-row {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        
        .table-row:hover {
            background: rgba(59, 130, 246, 0.05);
            border-left-color: var(--accent-orange);
            transform: translateX(4px);
        }
        
        .table-row:nth-child(even) {
            background: rgba(249, 250, 251, 0.8);
        }
        
        .sort-icon {
            transition: transform 0.3s ease;
        }
        
        .sort-icon.active {
            transform: rotate(180deg);
            color: var(--accent-orange);
        }
        
        .search-input {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(59, 130, 246, 0.2);
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .pagination-btn {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.3s ease;
        }
        
        .pagination-btn:hover {
            background: var(--primary-blue);
            color: white;
            transform: translateY(-2px);
        }
        
        .pagination-btn.active {
            background: var(--accent-orange);
            color: white;
            border-color: var(--accent-orange);
        }
        
        .message-content {
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mobile-cards {
            display: none;
        }
        
        @media (max-width: 768px) {
            .message-table {
                font-size: 12px;
            }
            
            .message-content {
                max-width: 200px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            .message-table {
                display: none;
            }
            
            .mobile-cards {
                display: block;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .loading-animation {
            opacity: 0;
            transform: translateY(20px);
        }
        
        .fade-in {
            animation: fadeInUp 0.6s ease forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .geometric-bg {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 300px;
            background: url('./resources/hero-bg.png') no-repeat center;
            background-size: cover;
            opacity: 0.1;
            z-index: 0;
        }
        
        .table-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: url('./resources/table-bg.png') no-repeat center;
            background-size: cover;
            opacity: 0.05;
            z-index: 0;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                        </svg>
                    </div>
                    <h1 class="text-xl font-bold text-gray-900">留言管理系统</h1>
                </div>
                <div class="flex items-center space-x-2">
                    <svg class="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l3 3a1 1 0 001.414-1.414L11 9.586V6z" clip-rule="evenodd"/>
                    </svg>
                    <span id="systemTime" class="font-semibold text-gray-800"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="relative bg-white overflow-hidden">
        <div class="geometric-bg"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 relative z-10">
            <div class="text-center">
                <h1 class="hero-title text-4xl md:text-5xl font-bold mb-4">
                    留言消息管理中心
                </h1>
                <p class="text-xl text-gray-600 mb-8 max-w-2xl mx-auto">
                    高效管理用户留言，支持智能搜索、多维度排序和实时筛选功能
                </p>
                <div class="w-24 h-1 bg-gradient-to-r from-blue-600 to-orange-400 mx-auto rounded-full"></div>
            </div>
        </div>
    </div>

    <!-- Statistics Cards -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-8 relative z-20">
        <div class="stats-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
            <div class="stats-card p-6 rounded-xl">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">总留言数</p>
                        <p class="text-3xl font-bold text-blue-600" id="totalMessages">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="stats-card p-6 rounded-xl">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">今日新增</p>
                        <p class="text-3xl font-bold text-green-600" id="todayMessages">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="stats-card p-6 rounded-xl">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">本周新增</p>
                        <p class="text-3xl font-bold text-orange-600" id="weekMessages">0</p>
                    </div>
                    <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-orange-600" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="stats-card p-6 rounded-xl">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">活跃用户数</p>
                        <p class="text-3xl font-bold text-purple-600" id="activeUsers">0</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-purple-600" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Search and Filter Section -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-8">
        <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
            <div class="flex flex-col md:flex-row gap-4 items-center">
                <div class="flex-1 relative">
                    <input type="text" id="searchInput" placeholder="搜索邮箱或留言内容..." 
                           class="search-input w-full pl-10 pr-4 py-3 rounded-lg outline-none">
                    <svg class="absolute left-3 top-3.5 w-5 h-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="flex gap-2">
                    <select id="dateFilter" class="search-input px-4 py-3 rounded-lg outline-none">
                        <option value="all">所有时间</option>
                        <option value="today">今天</option>
                        <option value="week">本周</option>
                        <option value="month">本月</option>
                    </select>
                    <button id="clearFilter" class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                        清除筛选
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Table Section -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-12 relative">
        <div class="table-bg"></div>
        <div class="message-table relative z-10">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="table-header">
                        <tr>
                            <th class="px-6 py-4 text-left text-sm font-medium cursor-pointer hover:bg-blue-700 transition-colors" onclick="sortTable('id')">
                                <div class="flex items-center space-x-2">
                                    <span>序号</span>
                                    <svg class="sort-icon w-4 h-4" id="sort-id" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                                    </svg>
                                </div>
                            </th>
                            <th class="px-6 py-4 text-left text-sm font-medium cursor-pointer hover:bg-blue-700 transition-colors" onclick="sortTable('email')">
                                <div class="flex items-center space-x-2">
                                    <span>邮箱</span>
                                    <svg class="sort-icon w-4 h-4" id="sort-email" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                                    </svg>
                                </div>
                            </th>
                            <th class="px-6 py-4 text-left text-sm font-medium">留言信息</th>
                            <th class="px-6 py-4 text-left text-sm font-medium cursor-pointer hover:bg-blue-700 transition-colors" onclick="sortTable('created_at')">
                                <div class="flex items-center space-x-2">
                                    <span>留言时间</span>
                                    <svg class="sort-icon w-4 h-4" id="sort-created_at" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                                    </svg>
                                </div>
                            </th>
                            <th class="px-6 py-4 text-left text-sm font-medium">操作</th>
                        </tr>
                    </thead>
                    <tbody id="messageTableBody">
                        <!-- Table rows will be dynamically generated -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Mobile Cards (Hidden by default) -->
        <div class="mobile-cards">
            <div id="messageCards" class="space-y-4">
                <!-- Mobile cards will be dynamically generated -->
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-12">
        <div class="flex justify-center">
            <nav class="flex items-center space-x-2" id="pagination">
                <!-- Pagination buttons will be dynamically generated -->
            </nav>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <p class="text-gray-600">© 2025 留言管理系统.</p>
            </div>
        </div>
    </footer>

    <!-- Message Modal -->
    <div id="messageModal" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-2xl p-8 max-w-2xl w-full m-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-800">完整留言信息</h2>
                <button id="closeModal" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
            </div>
            <div id="modalMessageContent" class="text-gray-700 text-lg leading-relaxed">
                <!-- Full message will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Main JavaScript -->
    <script src="./main-api.js"></script>
</body>
</html>
