class MessageManager {
    constructor() {

            "甯屾湜鑳藉鍔犵Щ鍔ㄧ鐨勫姛鑳斤紝鏂逛究鎵嬫満绔搷浣溿€�",
            "娉ㄥ唽娴佺▼寰堢畝鍗曪紝鐢ㄦ埛浣撻獙寰堝ソ锛屼細缁х画浣跨敤銆�",
            "浜у搧鍔熻兘寰堝叏闈紝鍩烘湰婊¤冻浜嗘垜浠叕鍙哥殑闇€姹傘€�",
            "甯屾湜鑳芥彁渚涙洿璇︾粏鐨勪娇鐢ㄦ暀绋嬪拰鏂囨。璇存槑銆�",

            "鐣岄潰璁捐鍙互鍐嶇編鍖栦竴浜涳紝鐜板湪鐨勯鏍兼湁鐐瑰崟璋冦€�"

        const sampleEmails = [

            const randomHours = Math.floor(Math.random() * 24);
            const randomMinutes = Math.floor(Math.random() * 60);
            
            const messageDate = new Date();
            messageDate.setDate(messageDate.getDate() - randomDays);
            messageDate.setHours(randomHours, randomMinutes, 0, 0);
            
            this.messages.push({
                id: i + 1,
                email: sampleEmails[Math.floor(Math.random() * sampleEmails.length)],
                message: sampleMessages[Math.floor(Math.random() * sampleMessages.length)],
                timestamp: messageDate,

    // 璁剧疆浜嬩欢鐩戝惉鍣�
    setupEventListeners() {
        const searchInput = document.getElementById('searchInput');
        const dateFilter = document.getElementById('dateFilter');
        const clearFilter = document.getElementById('clearFilter');
        
        searchInput.addEventListener('input', (e) => {
            this.searchQuery = e.target.value.toLowerCase();
            this.applyFilters();
        });
        
        dateFilter.addEventListener('change', (e) => {
            this.dateFilter = e.target.value;
            this.applyFilters();
        });
        
        clearFilter.addEventListener('click', () => {
            this.clearAllFilters();
        });
    }
    
    // 搴旂敤绛涢€夋潯浠�
    applyFilters() {
        this.filteredMessages = this.messages.filter(message => {
            // 鎼滅储绛涢€�
            const matchesSearch = !this.searchQuery || 
                message.email.toLowerCase().includes(this.searchQuery) ||
                message.message.toLowerCase().includes(this.searchQuery);
            
            // 鏃堕棿绛涢€�
            let matchesDate = true;
            const now = new Date();
            const messageDate = new Date(message.timestamp);
            
            switch (this.dateFilter) {
                case 'today':
                    matchesDate = messageDate.toDateString() === now.toDateString();
                    break;
                case 'week':
                    const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    matchesDate = messageDate >= weekAgo;
                    break;
                case 'month':
                    const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                    matchesDate = messageDate >= monthAgo;
                    break;
                default:
                    matchesDate = true;
            }
            
            return matchesSearch && matchesDate;
        });
        
        this.currentPage = 1;
        this.sortMessages();
        this.updateStatistics();
        this.renderTable();
        this.renderPagination();
    }
    
    // 娓呴櫎鎵€鏈夌瓫閫�
    clearAllFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('dateFilter').value = 'all';
        this.searchQuery = '';
        this.dateFilter = 'all';
        this.applyFilters();
    }
    
    // 鎺掑簭鍔熻兘
    sortTable(field) {
        if (this.sortField === field) {
            this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
            this.sortField = field;
            this.sortDirection = 'asc';
        }
        
        // 鏇存柊鎺掑簭鍥炬爣
        this.updateSortIcons(field);
        
        // 鎺掑簭鏁版嵁
        this.sortMessages();
        
        // 閲嶆柊娓叉煋琛ㄦ牸
        this.renderTable();
    }
    
    // 鎺掑簭娑堟伅
    sortMessages() {
        this.filteredMessages.sort((a, b) => {
            let aValue = a[this.sortField];
            let bValue = b[this.sortField];
            
            if (this.sortField === 'timestamp') {
                aValue = new Date(aValue).getTime();
                bValue = new Date(bValue).getTime();
            } else if (typeof aValue === 'string') {
                aValue = aValue.toLowerCase();
                bValue = bValue.toLowerCase();
            }
            
            if (this.sortDirection === 'asc') {
                return aValue > bValue ? 1 : -1;
            } else {
                return aValue < bValue ? 1 : -1;
            }
        });
    }
    
    // 鏇存柊鎺掑簭鍥炬爣
    updateSortIcons(activeField) {
        // 閲嶇疆鎵€鏈夊浘鏍�
        document.querySelectorAll('.sort-icon').forEach(icon => {
            icon.classList.remove('active');
            icon.style.transform = 'rotate(0deg)';
        });
        
        // 婵€娲诲綋鍓嶅瓧娈靛浘鏍�
        const activeIcon = document.getElementById(`sort-${activeField}`);
        if (activeIcon) {
            activeIcon.classList.add('active');
            if (this.sortDirection === 'desc') {
                activeIcon.style.transform = 'rotate(180deg)';
            }
        }
    }
    
    // 鏇存柊缁熻鏁版嵁
    updateStatistics() {
        const total = this.messages.length;
        const today = new Date();
        const todayMessages = this.messages.filter(msg => {
            const msgDate = new Date(msg.timestamp);
            return msgDate.toDateString() === today.toDateString();
        }).length;
        
        const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
        const weekMessages = this.messages.filter(msg => {
            const msgDate = new Date(msg.timestamp);
            return msgDate >= weekAgo;
        }).length;
        
        const uniqueUsers = new Set(this.messages.map(msg => msg.email)).size;
        
        // 鍔ㄧ敾鏇存柊鏁板瓧
        this.animateNumber('totalMessages', total);
        this.animateNumber('todayMessages', todayMessages);
        this.animateNumber('weekMessages', weekMessages);
        this.animateNumber('activeUsers', uniqueUsers);
    }
    
    // 鏁板瓧鍔ㄧ敾
    animateNumber(elementId, targetValue) {
        const element = document.getElementById(elementId);
        const startValue = 0;
        const duration = 1000;
        const startTime = performance.now();
        
        const animate = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            const currentValue = Math.floor(startValue + (targetValue - startValue) * progress);
            element.textContent = currentValue;
            
            if (progress < 1) {
                requestAnimationFrame(animate);
            }
        };
        
        requestAnimationFrame(animate);
    }
    
    // 娓叉煋琛ㄦ牸
    renderTable() {
        const tbody = document.getElementById('messageTableBody');
        const startIndex = (this.currentPage - 1) * this.itemsPerPage;
        const endIndex = startIndex + this.itemsPerPage;
        const pageMessages = this.filteredMessages.slice(startIndex, endIndex);
        
        tbody.innerHTML = '';
        
        pageMessages.forEach((message, index) => {
            const row = document.createElement('tr');
            row.className = 'table-row loading-animation';
            
            const formattedDate = new Date(message.timestamp).toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            row.innerHTML = `
                <td class="px-6 py-4 text-sm font-medium text-gray-900">${message.id}</td>
                <td class="px-6 py-4 text-sm text-gray-700">
                    <div class="flex items-center space-x-2">
                        <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                        </svg>
                        <span>${message.email}</span>
                    </div>
                </td>
                <td class="px-6 py-4 text-sm text-gray-700">
                    <div class="message-content" title="${message.message}">${message.message}</div>
                </td>
                <td class="px-6 py-4 text-sm text-gray-500">${formattedDate}</td>
            `;
            
            tbody.appendChild(row);
            
            // 娣诲姞鐐瑰嚮灞曞紑鍔熻兘
            row.addEventListener('click', () => {
                this.showMessageDetail(message);
            });
            
            // 鍔ㄧ敾寤惰繜
            setTimeout(() => {
                row.classList.add('fade-in');
            }, index * 50);
        });
        
        // 娓叉煋绉诲姩绔崱鐗�
        this.renderMobileCards(pageMessages);
    }
    
    // 娓叉煋绉诲姩绔崱鐗�
    renderMobileCards(messages) {
        const cardsContainer = document.getElementById('messageCards');
        cardsContainer.innerHTML = '';
        
        messages.forEach(message => {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-lg p-4 shadow-sm border border-gray-200 loading-animation';
            
            const formattedDate = new Date(message.timestamp).toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <span class="text-sm font-medium text-gray-900">#${message.id}</span>
                    <span class="text-xs text-gray-500">${formattedDate}</span>
                </div>
                <div class="flex items-center space-x-2 mb-3">
                    <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                        <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                    </svg>
                    <span class="text-sm text-gray-700">${message.email}</span>
                </div>
                <p class="text-sm text-gray-600 leading-relaxed">${message.message}</p>
            `;
            
            cardsContainer.appendChild(card);
            
            setTimeout(() => {
                card.classList.add('fade-in');
            }, 100);
        });
    }
    
    // 鏄剧ず鐣欒█璇︽儏
    showMessageDetail(message) {
        const formattedDate = new Date(message.timestamp).toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
        
        alert(`鐣欒█璇︽儏锛歕n\n搴忓彿锛�${message.id}\n閭锛�${message.email}\n鏃堕棿锛�${formattedDate}\n\n鍐呭锛歕n${message.message}`);
    }
    
    // 娓叉煋鍒嗛〉
    renderPagination() {
        const pagination = document.getElementById('pagination');
        const totalPages = Math.ceil(this.filteredMessages.length / this.itemsPerPage);
        
        pagination.innerHTML = '';
        
        // 涓婁竴椤垫寜閽�
        const prevBtn = document.createElement('button');
        prevBtn.className = `pagination-btn px-4 py-2 rounded-lg ${this.currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}`;
        prevBtn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>';
        prevBtn.disabled = this.currentPage === 1;
        prevBtn.addEventListener('click', () => {
            if (this.currentPage > 1) {
                this.goToPage(this.currentPage - 1);
            }
        });
        pagination.appendChild(prevBtn);
        
        // 椤电爜鎸夐挳
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= this.currentPage - 2 && i <= this.currentPage + 2)) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `pagination-btn px-4 py-2 rounded-lg ${i === this.currentPage ? 'active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.addEventListener('click', () => {
                    this.goToPage(i);
                });
                pagination.appendChild(pageBtn);
            } else if (i === this.currentPage - 3 || i === this.currentPage + 3) {
                const ellipsis = document.createElement('span');
                ellipsis.className = 'px-2 text-gray-500';
                ellipsis.textContent = '...';
                pagination.appendChild(ellipsis);
            }
        }
        
        // 涓嬩竴椤垫寜閽�
        const nextBtn = document.createElement('button');
        nextBtn.className = `pagination-btn px-4 py-2 rounded-lg ${this.currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}`;
        nextBtn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>';
        nextBtn.disabled = this.currentPage === totalPages;
        nextBtn.addEventListener('click', () => {
            if (this.currentPage < totalPages) {
                this.goToPage(this.currentPage + 1);
            }
        });
        pagination.appendChild(nextBtn);
    }
    
    // 璺宠浆鍒版寚瀹氶〉闈�
    goToPage(page) {
        this.currentPage = page;
        this.renderTable();
        this.renderPagination();
        
        // 婊氬姩鍒拌〃鏍奸《閮�
        document.querySelector('.message-table').scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });
    }
    
    // 椤甸潰鍔犺浇鍔ㄧ敾
    animatePageLoad() {
        // 缁熻鍗＄墖鍔ㄧ敾
        anime({
            targets: '.stats-card',
            translateY: [50, 0],
            opacity: [0, 1],
            delay: anime.stagger(100),
            duration: 800,
            easing: 'easeOutExpo'
        });
        
        // 琛ㄦ牸鍔ㄧ敾
        anime({
            targets: '.message-table',
            translateY: [30, 0],
            opacity: [0, 1],
            delay: 400,
            duration: 600,
            easing: 'easeOutExpo'
        });
    }
}

// 鍏ㄥ眬鍑芥暟

}

// 鍒濆鍖栧簲鐢�

window.addEventListener('resize', () => {
    if (window.innerWidth <= 480) {
        document.querySelector('.message-table').style.display = 'none';
        document.querySelector('.mobile-cards').style.display = 'block';

        document.querySelector('.message-table').style.display = 'block';
        document.querySelector('.mobile-cards').style.display = 'none';
    }
});
